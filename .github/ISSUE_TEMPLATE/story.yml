name: Story
description: One behavior someone can see working at the end of a sprint. One person, one sprint
type: Story
body:
  - type: markdown
    attributes:
      value: |
        The title is a capability sentence, for example *A player can dig through a cave wall*. Open it in its epic's repository and add it as a sub-issue of that epic. The rulebook is at https://github.com/Spellbound-Studios/Roadmap/blob/main/Rulebook.md.

        An idea goes in Backlog with its title and its Behavior sentence alone. The other fields are filled during refinement, and every one holds an answer or None by the time the story is Ready.
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What the actor can do when it is done, in one sentence.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks
      description: Write three to five checks, one per row, each as Given a context, When an action, Then a result.
      placeholder: Filled during refinement, or None.
  - type: input
    id: days
    attributes:
      label: Days
      description: The working days it takes, ten at most.
      placeholder: Filled during refinement, or None.
  - type: input
    id: waits-on
    attributes:
      label: Waits on
      description: "A story in this repository as #number, or None."
      placeholder: Filled during refinement, or None.
  - type: input
    id: time-box
    attributes:
      label: Time box
      description: None unless this is a spike; in working days, and above five days, split the question.
      placeholder: Filled during refinement, or None.
  - type: textarea
    id: default-answer
    attributes:
      label: Default answer
      description: None unless this is a spike; the answer used when the time box runs out.
      placeholder: Filled during refinement, or None.
  - type: input
    id: needed-by
    attributes:
      label: Needed by
      description: The epic in another repository that asked for this story, as Spellbound-Studios/<Repository>#<number> so the issue links it, or None when no other repository is waiting.
      placeholder: Filled during refinement, or None.
