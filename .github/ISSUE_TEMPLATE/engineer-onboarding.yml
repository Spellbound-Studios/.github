name: Engineer onboarding
description: Bring an engineer from nothing installed to a project open in the editor
type: Task
projects:
  - Spellbound-Studios/13
body:
  - type: markdown
    attributes:
      value: |
        The title is *Onboard (name)*. Open it for the engineer and tick the steps as they go. Every step is one line of bash or one address.
  - type: input
    id: repository
    attributes:
      label: First repository
      description: The address of the repository the engineer starts in
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor version
      description: Copied from ProjectSettings/ProjectVersion.txt of that repository
    validations:
      required: true
  - type: checkboxes
    id: steps
    attributes:
      label: Steps
      options:
        - label: Invited to the Spellbound-Studios organisation and the invitation accepted
        - label: "Git 2.14 or later and Git LFS installed. Windows: Git for Windows from https://gitforwindows.org with its default options gives bash, git and Git LFS together. Mac: git from https://git-scm.com/download/mac and Git LFS from https://git-lfs.com"
        - label: Unity Hub installed from https://unity.com/download, signed in, and the editor version above installed from the Hub
        - label: "The Unity command line installed with: curl -fsSL https://unity.com/install.sh | bash"
        - label: The repository cloned with git clone, then bash scripts/setup.sh run inside it
        - label: The project added in Unity Hub and opened once without errors
        - label: The line text read in full at https://github.com/Spellbound-Studios/.github/tree/main/line
        - label: On Discord, in the engineering channel
