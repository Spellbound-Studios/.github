name: Task
description: Necessary work that adds no behavior, such as documentation, tooling or clean-up
type: Task
body:
  - type: markdown
    attributes:
      value: |
        The title says what gets done, for example *Document the lobby's reconnect settings*. Open it in the repository it serves. The rulebook is at https://github.com/Spellbound-Studios/Roadmap/blob/main/Rulebook.md.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What this work makes possible or what cost it removes.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: What is true when the work is merged.
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: The working days it takes.
    validations:
      required: true
