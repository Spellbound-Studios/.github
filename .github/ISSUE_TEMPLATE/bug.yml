name: Bug
description: A story or published behavior is broken
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        The title says what is wrong in one sentence, for example *Health bar shows wrong value in builds*. Open it in the repository where the behavior is wrong. The rulebook is at https://github.com/Spellbound-Studios/Roadmap/blob/main/Rulebook.md.
  - type: input
    id: found-in
    attributes:
      label: Found in
      description: The version or branch where you saw it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The story or published behavior this breaks, and what should happen instead.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: What you did, in order, from a fresh start.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly this stops people from using what is broken.
      options:
        - Blocker
        - Major
        - Minor
    validations:
      required: true
  - type: textarea
    id: regression-test
    attributes:
      label: Regression test
      description: The test that fails now and passes once this is fixed, or None while it is not written.
    validations:
      required: true
