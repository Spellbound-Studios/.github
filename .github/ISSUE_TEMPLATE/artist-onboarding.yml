name: Artist onboarding
description: Bring an artist from nothing installed to the art registry open in Unity, ready to send
type: Task
projects:
  - Spellbound-Studios/13
body:
  - type: markdown
    attributes:
      value: |
        The title is *Onboard (name)*. An engineer opens this issue and ticks the access box; the artist follows the steps below. The rules an engineer works by are the line text at https://github.com/Spellbound-Studios/.github/tree/main/line.
  - type: checkboxes
    id: access
    attributes:
      label: Access
      options:
        - label: The artist's GitHub account is invited to the Spellbound-Studios organisation and the invitation is accepted
          required: true
  - type: markdown
    attributes:
      value: |
        **Steps for the artist, Windows**

        1. Install Git for Windows from https://gitforwindows.org with its default options. It gives you Git Bash, git and Git LFS together. This is the only program you install by hand.
        2. Open Git Bash and paste this one line, then press Enter:

           `bash <(curl -fsSL https://raw.githubusercontent.com/Spellbound-Studios/.github/main/setup.sh) Spellbound-Studios/ArtRegistry`

           It installs GitHub's command-line tool, the Unity command line, Unity Hub and the editor the registry needs, makes your SSH key, downloads the art registry with its large files and opens it once. It asks you two things: to sign in to GitHub and to Unity when a browser window opens, and which program you model in.
        3. If you model in Maya, open the registry in Unity Hub, then Edit, Project Settings, Fbx Export, pick Maya under 3D Application and press Install Unity Integration, with Maya closed. Maya then has a Unity menu under File.
        4. Read the artist's manual, the README at the root of the art registry.
        5. Join Discord at https://discord.gg/CtWfrZQNhY.

        A Mac route is written when a Mac user joins.
  - type: checkboxes
    id: done
    attributes:
      label: Done
      options:
        - label: The setup line finished with every step done or skipped
        - label: The artist opened the art registry in Unity
        - label: The artist's Maya shows the Unity menu, or the artist does not model in Maya
